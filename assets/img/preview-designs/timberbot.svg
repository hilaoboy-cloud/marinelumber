<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1E2C42"/>
      <stop offset="100%" stop-color="#0C1420"/>
    </radialGradient>
    <!-- Robot Head 3D Sphere Gradient -->
    <linearGradient id="headGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <!-- Screen Faceplate Gradient -->
    <linearGradient id="faceplateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <!-- Gold / Timber Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <!-- Glow Eyes -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="246" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="12 8" opacity="0.6"/>

  <g filter="url(#dropShadow)">
    <!-- Robot Shoulders / Torso -->
    <path d="M136 440 C136 370 200 360 256 360 C312 360 376 370 376 440 C376 490 136 490 136 440 Z" fill="#1E293B" stroke="#334155" stroke-width="4"/>
    <!-- Worker Collar / Hardhat Vest Accent -->
    <path d="M190 380 L256 420 L322 380 L300 450 L212 450 Z" fill="url(#goldGrad)"/>
    <!-- Small Timber Crate Emblem on chest -->
    <rect x="240" y="412" width="32" height="28" rx="4" fill="#78350F" stroke="#F59E0B" stroke-width="2"/>
    <line x1="240" y1="412" x2="272" y2="440" stroke="#F59E0B" stroke-width="2"/>

    <!-- Headset Band (Back) -->
    <path d="M120 220 C120 120 392 120 392 220" fill="none" stroke="#0F172A" stroke-width="18" stroke-linecap="round"/>

    <!-- Robot Head Main Base -->
    <rect x="136" y="140" width="240" height="200" rx="90" fill="url(#headGrad)" stroke="#CBD5E1" stroke-width="3"/>

    <!-- Safety Hardhat Visor Top Accent -->
    <path d="M140 180 C180 125 332 125 372 180 C360 150 330 130 256 130 C182 130 152 150 140 180 Z" fill="url(#goldGrad)"/>

    <!-- Dark Glossy Visor Screen (Faceplate) -->
    <rect x="160" y="180" width="192" height="135" rx="55" fill="url(#faceplateGrad)" stroke="#334155" stroke-width="3"/>
    <path d="M180 195 Q256 185 332 195" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.25"/>

    <!-- Glowing Cyber Blue Eyes (Happy Smiling Arcs) -->
    <g filter="url(#cyanGlow)">
      <path d="M195 242 Q215 220 235 242" fill="none" stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>
      <path d="M277 242 Q297 220 317 242" fill="none" stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>
      <!-- Friendly Smile -->
      <path d="M236 280 Q256 295 276 280" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Headset Ear Cushion Left -->
    <rect x="112" y="200" width="32" height="75" rx="14" fill="#0F172A" stroke="#D97706" stroke-width="4"/>
    <!-- Headset Ear Cushion Right -->
    <rect x="368" y="200" width="32" height="75" rx="14" fill="#0F172A" stroke="#D97706" stroke-width="4"/>

    <!-- Headset Boom Microphone Wire & Mic -->
    <path d="M124 255 C124 330 190 345 225 335" fill="none" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>
    <!-- Mic Tip with audio indicator light -->
    <rect x="225" y="325" width="28" height="18" rx="8" fill="#1E293B" stroke="#D97706" stroke-width="2"/>
    <circle cx="246" cy="334" r="3" fill="#10B981"/>
  </g>

  <!-- Speech Bubble Floating Accent (Top Right) -->
  <g transform="translate(340, 60)" filter="url(#dropShadow)">
    <path d="M0 30 C0 14 14 0 30 0 L100 0 C116 0 130 14 130 30 C130 46 116 60 100 60 L40 60 L15 80 L22 60 C8 60 0 46 0 30 Z" fill="#E8963A"/>
    <!-- Three AI Chatting Typing Dots -->
    <circle cx="45" cy="30" r="6" fill="#101C2C"/>
    <circle cx="65" cy="30" r="6" fill="#101C2C"/>
    <circle cx="85" cy="30" r="6" fill="#101C2C"/>
  </g>
</svg>