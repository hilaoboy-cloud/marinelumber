<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="cBgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1A2B42"/>
      <stop offset="100%" stop-color="#0A131F"/>
    </radialGradient>
    <linearGradient id="woodFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="woodTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="metalBrace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="cEyeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="256" fill="url(#cBgGrad)"/>
  <circle cx="256" cy="256" r="246" fill="none" stroke="#E8963A" stroke-width="4" stroke-dasharray="10 6" opacity="0.5"/>

  <g filter="url(#cShadow)">
    <!-- Crate Body (Main Box) -->
    <rect x="136" y="160" width="240" height="220" rx="24" fill="url(#woodFront)" stroke="#78350F" stroke-width="6"/>

    <!-- Diagonal Wood Braces -->
    <line x1="140" y1="164" x2="372" y2="376" stroke="#78350F" stroke-width="22" stroke-linecap="round" opacity="0.4"/>
    <line x1="140" y1="164" x2="372" y2="376" stroke="#F59E0B" stroke-width="16" stroke-linecap="round" opacity="0.3"/>

    <!-- Steel Corner Brackets -->
    <path d="M136 210 L136 160 L186 160 L186 180 L156 180 L156 210 Z" fill="url(#metalBrace)"/>
    <path d="M376 210 L376 160 L326 160 L326 180 L356 180 L356 210 Z" fill="url(#metalBrace)"/>
    <path d="M136 330 L136 380 L186 380 L186 360 L156 360 L156 330 Z" fill="url(#metalBrace)"/>
    <path d="M376 330 L376 380 L326 380 L326 360 L356 360 L356 330 Z" fill="url(#metalBrace)"/>

    <!-- Cute Big Digital Animated Eyes on Box -->
    <g filter="url(#cEyeGlow)">
      <!-- Left Eye -->
      <ellipse cx="210" cy="250" rx="26" ry="34" fill="#0F172A" stroke="#38BDF8" stroke-width="6"/>
      <circle cx="218" cy="240" r="10" fill="#38BDF8"/>
      <circle cx="222" cy="236" r="4" fill="#FFFFFF"/>
      <!-- Right Eye -->
      <ellipse cx="302" cy="250" rx="26" ry="34" fill="#0F172A" stroke="#38BDF8" stroke-width="6"/>
      <circle cx="310" cy="240" r="10" fill="#38BDF8"/>
      <circle cx="314" cy="236" r="4" fill="#FFFFFF"/>
      <!-- Friendly Smile Mouth -->
      <path d="M236 295 Q256 320 276 295" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Communication Headset (Curve over box) -->
    <path d="M120 250 C120 120 392 120 392 250" fill="none" stroke="#0F172A" stroke-width="16" stroke-linecap="round"/>
    <!-- Headset Cushions -->
    <rect x="110" y="225" width="28" height="60" rx="12" fill="#0F172A" stroke="#E8963A" stroke-width="4"/>
    <rect x="374" y="225" width="28" height="60" rx="12" fill="#0F172A" stroke="#E8963A" stroke-width="4"/>
    <!-- Boom Microphone -->
    <path d="M120 265 C120 350 200 365 230 350" fill="none" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>
    <rect x="230" y="340" width="26" height="16" rx="8" fill="#1E293B" stroke="#E8963A" stroke-width="2"/>
    <circle cx="250" cy="348" r="3" fill="#10B981"/>

    <!-- Cute Little White Glove Hand Waving (Left) -->
    <g transform="translate(85, 300) rotate(-25)">
      <ellipse cx="25" cy="25" rx="22" ry="18" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>
      <circle cx="38" cy="14" r="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
    </g>
  </g>

  <!-- Speech Bubble (Top Right) -->
  <g transform="translate(340, 65)" filter="url(#cShadow)">
    <path d="M0 26 C0 12 12 0 26 0 L94 0 C108 0 120 12 120 26 C120 40 108 52 94 52 L35 52 L12 70 L18 52 C8 52 0 40 0 26 Z" fill="#E8963A"/>
    <text x="60" y="34" fill="#101C2C" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">AI</text>
  </g>
</svg>